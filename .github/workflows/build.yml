name: Test & Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test on Simulator & Package IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Langkah 1: Test compile di iOS Simulator
      - name: Test Build on iOS Simulator
        run: |
          if [ -d "app ios" ]; then
            cd "app ios"
          fi
          xcodebuild clean build \
            -project MusicPlayer.xcodeproj \
            -scheme MusicPlayer \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

      # Langkah 2: Build & archive untuk iPhone fisik
      - name: Build & Archive for Device
        run: |
          if [ -d "app ios" ]; then
            cd "app ios"
          fi
          xcodebuild archive \
            -project MusicPlayer.xcodeproj \
            -scheme MusicPlayer \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/MusicPlayer.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # Langkah 3: Bungkus menjadi file .IPA
      - name: Package Payload into .IPA
        run: |
          if [ -d "app ios" ]; then
            cd "app ios"
          fi
          APP_DIR="build/MusicPlayer.xcarchive/Products/Applications/MusicPlayer.app"
          ICON_SRC="MusicPlayer/Assets.xcassets/AppIcon.appiconset"
          
          # Copy loose icon files into the .app bundle for SpringBoard and sideloaders
          cp "$ICON_SRC/AppIcon-60x60@3x.png" "$APP_DIR/AppIcon60x60@3x.png"
          cp "$ICON_SRC/AppIcon-60x60@2x.png" "$APP_DIR/AppIcon60x60@2x.png"
          cp "$ICON_SRC/AppIcon-76x76@2x.png" "$APP_DIR/AppIcon76x76@2x.png"
          cp "$ICON_SRC/AppIcon-76x76@2x.png" "$APP_DIR/AppIcon76x76@2x~ipad.png"
          cp "$ICON_SRC/AppIcon-1024.png" "$APP_DIR/AppIcon-1024.png"
          cp "$ICON_SRC/AppIcon-1024.png" "$APP_DIR/AppIcon.png"
          cp "$ICON_SRC/AppIcon-60x60@2x.png" "$APP_DIR/AppIcon@2x.png"
          cp "$ICON_SRC/AppIcon-60x60@3x.png" "$APP_DIR/AppIcon@3x.png"
          cp "$ICON_SRC/AppIcon-1024.png" "$APP_DIR/iTunesArtwork"
          cp "$ICON_SRC/AppIcon-1024.png" "$APP_DIR/iTunesArtwork@2x"
          
          mkdir -p build/Payload
          cp -R "$APP_DIR" build/Payload/
          
          # Place iTunesArtwork at root of IPA archive for sideloaders (AltStore / TrollStore)
          cp "$ICON_SRC/AppIcon-1024.png" build/iTunesArtwork
          cp "$ICON_SRC/AppIcon-1024.png" build/iTunesArtwork@2x
          
          cd build
          zip -r -y MusicPlayer.ipa Payload iTunesArtwork iTunesArtwork@2x

      # Langkah 4: Simpan file .IPA untuk diunduh
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-iOS-IPA
          path: "**/build/MusicPlayer.ipa"
          retention-days: 14
